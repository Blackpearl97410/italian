[project]
name = "langues-pas-a-pas"
version = "0.1.0"
description = "Application desktop PySide6 pour apprendre anglais et italien depuis le francais."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

